name: SLP production release gate

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY to release the current main SHA to Railway production"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: slp-production-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify exact main SHA
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse stale or non-main release
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          LIVE_MAIN="$(git rev-parse origin/main)"
          echo "workflow_sha=$GITHUB_SHA"
          echo "current_main=$LIVE_MAIN"
          test "$LIVE_MAIN" = "$GITHUB_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile project
        run: python -m compileall -q .

      - name: Run full regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run live-source smoke
        run: PYTHONPATH=. python tests/live_source_smoke.py

  deploy:
    name: Deploy verified SHA to Railway
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: 5936200c-6ca2-4d33-9a4b-a860e11c1ff8
      RAILWAY_ENVIRONMENT: production
      RAILWAY_SERVICE: slp-bot
    steps:
      - name: Checkout the same verified SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Refuse deploy if main moved during verification
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          LIVE_MAIN="$(git rev-parse origin/main)"
          echo "release_sha=$GITHUB_SHA"
          echo "current_main=$LIVE_MAIN"
          test "$LIVE_MAIN" = "$GITHUB_SHA"

      - name: Require project-scoped Railway token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::error::GitHub Actions secret RAILWAY_TOKEN is not configured."
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Stamp release SHA into uploaded workspace
        shell: bash
        run: printf '%s\n' "$GITHUB_SHA" > .slp-release-sha

      - name: Deploy exact checked-out workspace
        shell: bash
        run: |
          set -euo pipefail
          railway up \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$RAILWAY_SERVICE" \
            --ci \
            --message "GitHub release $GITHUB_SHA"
