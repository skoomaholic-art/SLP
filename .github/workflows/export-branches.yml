name: Export SLP branch archives

on:
  push:
    branches:
      - tmp-ignore
    paths:
      - ".github/workflows/export-branches.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cloud-run branch
        uses: actions/checkout@v4
        with:
          ref: feature/cloud-run-sports-web
          path: cloud-run-sports-web
          fetch-depth: 0

      - name: Checkout Gmail/Drive branch
        uses: actions/checkout@v4
        with:
          ref: feature/free-apps-script-gmail-drive
          path: free-apps-script-gmail-drive
          fetch-depth: 0

      - name: Build exact branch archives
        shell: bash
        run: |
          set -euo pipefail
          git -C cloud-run-sports-web archive             --format=zip             --output="$GITHUB_WORKSPACE/SLP-feature-cloud-run-sports-web.zip"             HEAD
          git -C free-apps-script-gmail-drive archive             --format=zip             --output="$GITHUB_WORKSPACE/SLP-feature-free-apps-script-gmail-drive.zip"             HEAD

      - name: Upload cloud-run branch archive
        uses: actions/upload-artifact@v4
        with:
          name: SLP-feature-cloud-run-sports-web
          path: SLP-feature-cloud-run-sports-web.zip
          if-no-files-found: error
          retention-days: 1

      - name: Upload Gmail/Drive branch archive
        uses: actions/upload-artifact@v4
        with:
          name: SLP-feature-free-apps-script-gmail-drive
          path: SLP-feature-free-apps-script-gmail-drive.zip
          if-no-files-found: error
          retention-days: 1
