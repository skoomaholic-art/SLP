name: SLP tests

on:
  push:
    branches:
      - main
      - fix/live-pipeline-2026-09-11
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BOT_TOKEN: "123456789:TEST_TOKEN_FOR_IMPORTS_ONLY"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: baseline
        run: python -m unittest discover -s tests -p 'test_baseline.py' -v
      - name: event contract
        if: always()
        run: python -m unittest discover -s tests -p 'test_event_contract.py' -v
      - name: event status
        if: always()
        run: python -m unittest discover -s tests -p 'test_event_status.py' -v
      - name: event store
        if: always()
        run: python -m unittest discover -s tests -p 'test_event_store.py' -v
      - name: main merge integration
        if: always()
        run: python -m unittest discover -s tests -p 'test_main_merge_integration.py' -v
      - name: notification integration
        if: always()
        run: python -m unittest discover -s tests -p 'test_main_notifications_integration.py' -v
      - name: OpenSERP extract
        if: always()
        run: python -m unittest discover -s tests -p 'test_openserp_extract.py' -v
      - name: OpenSERP speed
        if: always()
        run: python -m unittest discover -s tests -p 'test_openserp_speed.py' -v
      - name: Qazsport normalization
        if: always()
        run: python -m unittest discover -s tests -p 'test_qazsport_normalization.py' -v
      - name: compact schedule view
        if: always()
        run: python -m unittest discover -s tests -p 'test_schedule_compact_view.py' -v
      - name: schedule loader
        if: always()
        run: python -m unittest discover -s tests -p 'test_schedule_loader.py' -v
      - name: schedule merge
        if: always()
        run: python -m unittest discover -s tests -p 'test_schedule_merge.py' -v
      - name: schedule watch
        if: always()
        run: python -m unittest discover -s tests -p 'test_schedule_watch.py' -v
      - name: SportPlus
        if: always()
        run: python -m unittest discover -s tests -p 'test_sportplus.py' -v
      - name: time logic
        if: always()
        run: python -m unittest discover -s tests -p 'test_time_logic.py' -v

      - name: Full suite
        if: success()
        run: python -m unittest discover -s tests -v
