name: Claude Code agent

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@claude"
          branch_prefix: "claude/"
          additional_permissions: |
            actions: read
          claude_args: |
            --max-turns 30
            --allowedTools "Bash Read Edit Write"
            --append-system-prompt "Read CLAUDE.md and AGENTS.md before making changes. Work only on the requested task. Run the repository verification ladder. Never access secrets, never deploy Railway production, never push directly to main, and never merge your own PR. Finish with concrete verification evidence and remaining blockers."
