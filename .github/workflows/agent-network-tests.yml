name: Agent network tests

on:
  push:
    branches:
      - agent-network-v1
  pull_request:
    paths:
      - "agents/**"
      - "storage/**"
      - "agent_main.py"
      - "tests/**"
      - ".github/workflows/agent-network-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile project
        run: python -m compileall -q .

      - name: Run full unit regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
