name: SLP Cloud Run web

on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "requirements-cloudrun.txt"
      - "cloudrun_web.py"
      - "cloudrun_ui/**"
      - "cloudrun_tests/**"
      - "scripts/cloudrun_users.py"
      - ".github/workflows/cloudrun-web.yml"
  workflow_dispatch:

jobs:
  web-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install web and parser dependencies
        run: python -m pip install -r requirements.txt -r requirements-cloudrun.txt
      - name: Compile web entrypoint
        run: python -m compileall -q cloudrun_web.py cloudrun_tests scripts/cloudrun_users.py
      - name: Web-only regression
        run: PYTHONPATH=. python -m unittest discover -s cloudrun_tests -p "test_*.py" -v
