name: SLP live source smoke

on:
  push:
    branches:
      - main
    paths:
      - "parsers/**"
      - "services/event_contract.py"
      - "services/channel_registry.py"
      - "services/source_routing.py"
      - "services/agent_reach_web.py"
      - "tests/live_source_smoke.py"
      - ".github/workflows/source-smoke.yml"
  pull_request:
    paths:
      - "parsers/**"
      - "services/event_contract.py"
      - "tests/live_source_smoke.py"
      - ".github/workflows/source-smoke.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  live-source-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Parse current live source pages
        run: PYTHONPATH=. python tests/live_source_smoke.py
